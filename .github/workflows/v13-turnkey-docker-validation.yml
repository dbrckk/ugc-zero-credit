name: V13 turnkey private server Docker — real bilingual CPU
on:
  push:
    branches:
      - feat/v13-turnkey-bilingual-deploy
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Check container syntax and isolated host-port policy
        run: |
          python3 -m compileall -q studio_web.py offline_presenter.py voice_catalog.py
          bash -n install_studio.sh
          if grep -E '^ *-.*0\.0\.0\.0:[0-9]' docker-compose.yml; then
            echo "Public container port forbidden"; exit 1
          fi
          docker compose version
      - name: Build real Piper + FFmpeg image with both voices (cached build layers)
        run: |
          export UGC_STUDIO_TOKEN=ci-local-test-token-THIS-IS-NOT-FOR-PRODUCTION
          export UGC_STUDIO_PORT=18787
          docker compose -f docker-compose.yml build
          docker compose -f docker-compose.yml up -d
      - name: Generate French and English WAV through the private HTTP studio
        env:
          UGC_STUDIO_TOKEN: ci-local-test-token-THIS-IS-NOT-FOR-PRODUCTION
          UGC_STUDIO_PORT: "18787"
          UGC_V13_STATE_FILE: ${{ runner.temp }}/ugc-v13-state.txt
        run: |
          python3 functional_checks_v13_container.py
      - name: Persist files after an actual container restart
        env:
          UGC_STUDIO_TOKEN: ci-local-test-token-THIS-IS-NOT-FOR-PRODUCTION
          UGC_STUDIO_PORT: "18787"
          UGC_V13_STATE_FILE: ${{ runner.temp }}/ugc-v13-state.txt
        run: |
          docker compose -f docker-compose.yml restart studio
          python3 functional_checks_v13_container.py --after-restart
      - name: Diagnostics on failure
        if: failure()
        run: |
          export UGC_STUDIO_TOKEN=ci-local-test-token-THIS-IS-NOT-FOR-PRODUCTION
          export UGC_STUDIO_PORT=18787
          docker compose -f docker-compose.yml ps || true
          docker compose -f docker-compose.yml logs --tail 75 || true
      - name: Shut down test server without deleting persistent volumes
        if: always()
        run: |
          export UGC_STUDIO_TOKEN=ci-local-test-token-THIS-IS-NOT-FOR-PRODUCTION
          export UGC_STUDIO_PORT=18787
          docker compose -f docker-compose.yml down || true
