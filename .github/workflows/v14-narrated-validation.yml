name: V14 real narrated photo Shorts — local CPU Piper plus FFmpeg
on:
  push:
    branches: [feat/v14-narrated-photo-shorts, feat/v15-short-visual-polish, feat/v16-visual-storytelling, fix/v17-output-symlink-safety, feat/v18-animated-headline-progress, feat/v19-cinematic-photo-stage, feat/v20-audio-aware-scene-cuts, feat/v21-private-musetalk-android, feat/v22-presenter-readiness-av-qa, feat/v23-moving-presenter-video, feat/v24-gpu-host-bootstrap, feat/v25-kaggle-gpu-batch, feat/v26-kaggle-one-command-automation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate GPU bootstrap scripts without inventing CUDA availability
        run: |
          bash -n gpu_host.sh gpu_acceptance.sh
          python -m compileall -q gpu_fetch_weights.py offline_presenter.py studio_web.py
          if bash gpu_host.sh --doctor >gpu-doctor.log 2>&1; then
            echo 'ERROR: CPU runner falsely reported NVIDIA MuseTalk readiness'
            exit 1
          fi
          grep -q 'ERREUR GPU' gpu-doctor.log
          if bash gpu_acceptance.sh >gpu-acceptance.log 2>&1; then
            echo 'ERROR: GPU acceptance unexpectedly succeeded without authorized media'
            exit 1
          fi
          grep -q 'Utilisation :' gpu-acceptance.log
          rm -f gpu-doctor.log gpu-acceptance.log
          bash -n gpu_host.sh gpu_acceptance.sh
      - name: Install real FFmpeg, font and pinned Piper CPU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install 'piper-tts==1.8.0'
      - name: Verify Kaggle notebook structure and actual clip validation, without any GPU download
        run: |
          python -m compileall -q kaggle_musetalk.py kaggle_automate.py functional_checks_v26_kaggle.py
          python - <<'PY'
          import json
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          nb = json.loads(Path("kaggle/ugc_musetalk_gpu.ipynb").read_text(encoding="utf-8"))
          assert nb["nbformat"] == 4
          assert len(nb["cells"]) >= 5
          code = "\n".join("".join(c["source"]) for c in nb["cells"] if c["cell_type"] == "code")
          assert "--stage','preflight'" in code and "--stage','all'" in code
          with tempfile.TemporaryDirectory(prefix="ugc-kaggle-real-") as tmp:
              folder = Path(tmp) / "private-assets"
              folder.mkdir()
              video = folder / "presenter.mp4"
              subprocess.run(["ffmpeg", "-hide_banner", "-loglevel", "error", "-y",
                              "-f", "lavfi", "-i", "testsrc2=s=320x512:r=25", "-t", "1.3",
                              "-c:v", "libx264", "-preset", "ultrafast", str(video)],
                             check=True, capture_output=True, timeout=75)
              (folder / "script.txt").write_text("Bonjour, voici notre véritable essai vidéo local.")
              (folder / "language.txt").write_text("fr")
              (folder / "portrait_rights.txt").write_text("Autorisation laboratoire de validation CI, usage fictif")
              cmd = [sys.executable, "kaggle_musetalk.py", "--input-root", str(Path(tmp))]
              subprocess.run([*cmd, "--stage", "check-assets"], check=True, timeout=35)
              failure = subprocess.run([*cmd, "--stage", "preflight"],
                                       capture_output=True, text=True, timeout=35)
              assert failure.returncode != 0
              assert "Kaggle" in failure.stderr or "GPU" in failure.stderr
              (folder / "language.txt").write_text("invalid")
              failure = subprocess.run([*cmd, "--stage", "check-assets"],
                                       capture_output=True, text=True, timeout=35)
              assert failure.returncode != 0 and "language.txt" in failure.stderr
          print("Validated real encoded input, CPU refusal, notebook configuration and privacy gates")
          PY
      - name: Test complete private Kaggle API orchestration control plane
        run: |
          python -m compileall -q kaggle_automate.py functional_checks_v26_kaggle.py
          python functional_checks_v26_kaggle.py
          python - <<'PY'
          from pathlib import Path
          yml = Path(".github/workflows/kaggle-private-gpu.yml").read_text()
          assert "workflow_dispatch:" in yml
          assert "KAGGLE_API_TOKEN" in yml
          assert "cancel-in-progress: false" in yml
          assert "kaggle_automate.py" in yml
          assert "schedule:" not in yml
          PY
      - name: Download public FR/EN test voices only
        run: |
          python -m piper.download_voices fr_FR-siwis-medium en_US-lessac-medium --data-dir "$RUNNER_TEMP/ugc-voices"
          test -s "$RUNNER_TEMP/ugc-voices/en_US-lessac-medium.onnx"
          test -s "$RUNNER_TEMP/ugc-voices/fr_FR-siwis-medium.onnx"
      - name: Validate real audio and Full-HD MP4, then older functional regressions
        env:
          UGC_TEST_PIPER_MODEL: ${{ runner.temp }}/ugc-voices/fr_FR-siwis-medium.onnx
          UGC_TEST_PIPER_MODEL_EN: ${{ runner.temp }}/ugc-voices/en_US-lessac-medium.onnx
          UGC_V16_ARTIFACTS_DIR: ${{ runner.temp }}/ugc-v25-frames
        run: |
          python -m compileall -q studio_web.py narrated_short.py offline_presenter.py speech_scene_timing.py functional_checks_v14.py
          node --check studio_web/studio.js
          python functional_checks_v14.py
          python functional_checks_v12.py
          python functional_checks_v11_web.py
          python functional_checks_v10.py
          python functional_checks_v9.py
      - name: Save real preview and Full-HD frames for visual QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ugc-v25-kaggle-frames
          path: ${{ runner.temp }}/ugc-v25-frames/*.png
          if-no-files-found: ignore
          retention-days: 3
      - name: Build real private Docker studio (two ONNX voice models)
        run: |
          printf '%s\n' 'UGC_STUDIO_TOKEN=v14-ci-private-long-token-for-testing-only' 'UGC_STUDIO_PORT=18787' > .env
          chmod 600 .env
          bash install_studio.sh
      - name: Verify bilingual voice, Docker font, and persistent HTTP media
        env:
          UGC_STUDIO_TOKEN: v14-ci-private-long-token-for-testing-only
          UGC_STUDIO_PORT: "18787"
          UGC_V13_STATE_FILE: ${{ runner.temp }}/v14-container-state.txt
        run: |
          docker compose -f docker-compose.yml exec -T studio python -c "from narrated_short import FONT; assert FONT.is_file(), FONT; print('V14 DejaVu font installed inside real Docker image')"
          python functional_checks_v13_container.py
          docker compose -f docker-compose.yml restart studio
          python functional_checks_v13_container.py --after-restart
      - name: Diagnostics if container job fails
        if: failure()
        run: |
          export UGC_STUDIO_TOKEN=v14-ci-private-long-token-for-testing-only
          export UGC_STUDIO_PORT=18787
          docker compose -f docker-compose.yml ps || true
          docker compose -f docker-compose.yml logs --tail 80 || true
      - name: Clean up Docker containers, preserve data volume
        if: always()
        run: |
          export UGC_STUDIO_TOKEN=v14-ci-private-long-token-for-testing-only
          export UGC_STUDIO_PORT=18787
          docker compose -f docker-compose.yml down || true
