name: V10 visual PIP and real media QA (no paid APIs)
on:
  push:
    branches:
      - feat/v10-product-picture-in-picture
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install local FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Compile and create synthetic footage
        run: |
          python3 -m compileall -q ugc.py overlay_layout.py studio_web.py editorial_quality.py auto_edit.py functional_checks_v10.py
          python3 make_synthetic_demo.py
      - name: Render genuine picture-in-picture demo and audit
        run: python3 functional_checks_v10.py
      - name: Regression of Android studio and render queue
        run: |
          python3 functional_checks_v9.py
          python3 functional_checks_v8.py
