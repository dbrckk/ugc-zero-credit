name: V9 gated integration (free CPU, no APIs)
on:
  push:
    branches:
      - feat/v9-bounded-render-queue
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install local open-source renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Verify Python syntax and generate synthetic media
        run: |
          python3 -m compileall -q .
          python3 make_synthetic_demo.py
      - name: Run queue tests and real HTTP/FFmpeg checks
        run: |
          python3 functional_checks_v9.py
          python3 functional_checks_v8.py
